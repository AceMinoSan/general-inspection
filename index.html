<script>

function openDirector() {
    const staff = document.getElementById("seniorStaffPage");
    const profile = document.getElementById("directorProfile");

        staff.style.display = "none";
        profile.style.display = "block";
        window.scrollTo(0, 0);
        setTimeout(() => {
            profile.classList.add("active");

    }, 300);

/* =========================

========================= */
function openContact() {
    window.location.href = "https://discord.gg/gnSXF82rt";
}
/* =========================
   DISCORD WEBHOOK
========================= */
/*
   ВСТАВЬ СЮДА СВОЙ DISCORD WEBHOOK.
   Например:
   const DISCORD_WEBHOOK_URL =
       "https://discord.com/api/webhooks/.....";
*/
const DISCORD_WEBHOOK_URL = "ВСТАВЬ_СЮДА_WEBHOOK";
/* =========================
   COMPLAINT FORM
========================= */
document
    .getElementById("complaintForm")
    .addEventListener("submit", async function(event) {
        event.preventDefault();
        const button =
            document.querySelector(".submit-complaint");
        const name =
            document
                .getElementById("complainantName")
                .value
                .trim();
        const contact =
            document
                .getElementById("contactInfo")
                .value
                .trim();
        const employee =
            document
                .getElementById("employeeName")
                .value
                .trim();
        const date =
            document
                .getElementById("incidentDate")
                .value;
        const place =
            document
                .getElementById("incidentPlace")
                .value
                .trim();
        const text =
            document
                .getElementById("complaintText")
                .value
                .trim();
        /* Проверяем поля */
        if (
            !name ||
            !contact ||
            !employee ||
            !date ||
            !place ||
            !text
        ) {
            alert("გთხოვთ შეავსოთ ყველა ველი.");
            return;
        }
        /* Проверяем Webhook */
        if (
            !DISCORD_WEBHOOK_URL ||
            DISCORD_WEBHOOK_URL === "ВСТАВЬ_СЮДА_WEBHOOK"
        ) {
            alert(
                "Discord Webhook არ არის მითითებული."
            );
            return;
        }
        /* Блокируем кнопку */
        button.disabled = true;
        button.textContent = "იგზავნება...";
        /* Формируем сообщение */
        const discordMessage = {
            username: "გენერალური ინსპექცია",
            embeds: [
                {
                    title: "📋 ახალი საჩივარი",
                    color: 1205104,
                    fields: [
                        {
                            name: "👤 მომჩივნის სახელი და გვარი",
                            value: name,
                            inline: false
                        },
                        {
                            name: "📞 საკონტაქტო ინფორმაცია",
                            value: contact,
                            inline: false
                        },
                        {
                            name: "👮 თანამშრომლის სახელი და გვარი",
                            value: employee,
                            inline: false
                        },
                        {
                            name: "📅 შემთხვევის თარიღი",
                            value: date,
                            inline: true
                        },
                        {
                            name: "📍 შემთხვევის ადგილი",
                            value: place,
                            inline: true
                        },
                        {
                            name: "📝 საჩივრის აღწერა",
                            value: text,
                            inline: false
                        }
                    ],
                    footer: {
                        text:
                            "საქართველოს შინაგან საქმეთა სამინისტროს გენერალური ინსპექციის დეპარტამენტი"
                    },
                    timestamp:
                        new Date().toISOString()
                }
            ]
        };
        /* =========================
           SEND TO DISCORD
        ========================= */
        try {
            const response = await fetch(
                DISCORD_WEBHOOK_URL,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body:
                        JSON.stringify(discordMessage)
                }
            );
            /* Discord должен вернуть 2xx */
            if (!response.ok) {
                throw new Error(
                    "Discord returned HTTP " +
                    response.status
                );
            }
            /* Успешно */
            const form =
                document.getElementById(
                    "complaintForm"
                );
            const success =
                document.getElementById(
                    "successMessage"
                );
            form.style.display = "none";
            success.style.display = "block";
            window.scrollTo(0, 0);
        } catch (error) {
            console.error(
                "Discord Webhook Error:",
                error
            );
            alert(
                "საჩივრის გაგზავნა ვერ მოხერხდა. გთხოვთ სცადოთ მოგვიანებით."
            );
            button.disabled = false;
            button.textContent =
                "საჩივრის გაგზავნა";
        }
    });
